name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Use official Gradle distribution in CI
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|g' gradle/wrapper/gradle-wrapper.properties

      - name: Use Maven Central and Google in CI
        run: |
          python3 <<'PY'
          from pathlib import Path
          lines = Path("settings.gradle.kts").read_text().splitlines(keepends=True)
          filtered = [
              line for line in lines
              if "maven.aliyun.com" not in line and "mirrors.cloud.tencent.com" not in line
          ]
          Path("settings.gradle.kts").write_text("".join(filtered))
          PY

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Prepare release asset
        id: meta
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/.*= ([0-9]+).*/\1/')
          ASSET="ddtask-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.meta.outputs.version) || github.ref_name }}
          name: v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.code }})
          body: |
            ## 安装包

            下载 **${{ steps.meta.outputs.asset }}** 安装到 Android 6.0+ 设备。

            | 项目 | 值 |
            |------|-----|
            | versionName | ${{ steps.meta.outputs.version }} |
            | versionCode | ${{ steps.meta.outputs.code }} |
            | 构建类型 | debug |
          files: ${{ steps.meta.outputs.asset }}
          generate_release_notes: true
          make_latest: true
